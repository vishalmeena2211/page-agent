<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#9333ea"/></linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#bg)"/>
  <!-- faint index tags -->
  <g fill="#ffffff" opacity="0.04" font-size="24">
    <text x="60" y="60">[12]&lt;input/&gt;</text><text x="700" y="44">[35]&lt;button&gt;</text><text x="1500" y="70">[33]&lt;div&gt;</text><text x="1760" y="300">[8]&lt;select&gt;</text><text x="1620" y="570">[41]&lt;a&gt;</text><text x="260" y="585">[19]&lt;textarea&gt;</text>
  </g>
  <!-- title -->
  <text x="120" y="190" font-size="92" font-weight="700" fill="#f8fafc" letter-spacing="-2">page-agent</text>
  <text x="124" y="252" font-size="34" fill="#f8fafc" opacity="0.85">A fork of alibaba/page-agent. An agent inside your web page: one sentence in, clicks out.</text>

  <!-- 1. the instruction -->
  <g transform="translate(120,318)">
    <text x="0" y="-14" font-size="22" fill="#f8fafc" opacity="0.7">1. The user types</text>
    <rect x="0" y="0" width="520" height="92" rx="20" fill="url(#accent)"/>
    <text x="30" y="40" font-size="24" fill="#ffffff" font-weight="700">Click submit button, then</text>
    <text x="30" y="72" font-size="24" fill="#ffffff" font-weight="700">fill username as John</text>
    <text x="0" y="128" font-size="20" fill="#f8fafc" opacity="0.6">from the panel, or agent.execute(task)</text>
  </g>
  <!-- arrow -->
  <g stroke="#f8fafc" stroke-opacity="0.4" stroke-width="3" fill="none">
    <path d="M660 364 L730 364"/><path d="M718 352 L732 364 L718 376"/>
  </g>

  <!-- 2. the steps -->
  <g transform="translate(760,318)">
    <text x="0" y="-14" font-size="22" fill="#f8fafc" opacity="0.7">2. The model reads indexed text and picks one tool a step</text>
    <rect x="0" y="0" width="620" height="200" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <g font-size="21" fill="#f8fafc">
      <text x="24" y="44" fill="#93c5fd" font-weight="700">step 1</text><text x="110" y="44">input_text</text><text x="260" y="44" opacity="0.7">index 12, text "John"</text>
      <text x="24" y="86" fill="#93c5fd" font-weight="700">step 2</text><text x="110" y="86">click_element_by_index</text><text x="372" y="86" opacity="0.7">index 35</text>
      <text x="24" y="128" fill="#93c5fd" font-weight="700">step 3</text><text x="110" y="128">done</text><text x="260" y="128" opacity="0.7">success true, 3 of 40 steps</text>
      <text x="24" y="172" font-size="18" opacity="0.6">first a reflection: last result, memory, next goal</text>
    </g>
  </g>
  <!-- arrow -->
  <g stroke="#f8fafc" stroke-opacity="0.4" stroke-width="3" fill="none">
    <path d="M1400 364 L1470 364"/><path d="M1458 352 L1472 364 L1458 376"/>
  </g>

  <!-- 3. the page -->
  <g transform="translate(1500,318)">
    <text x="0" y="-14" font-size="22" fill="#f8fafc" opacity="0.7">3. It happens on the page</text>
    <rect x="0" y="0" width="300" height="236" rx="12" fill="#f8fafc"/>
    <rect x="0" y="0" width="300" height="30" rx="12" fill="#e2e8f0"/>
    <circle cx="18" cy="15" r="5" fill="#cbd5e1"/><circle cx="34" cy="15" r="5" fill="#cbd5e1"/><circle cx="50" cy="15" r="5" fill="#cbd5e1"/>
    <text x="20" y="66" font-size="16" font-weight="700" fill="#0f172a">User form</text>
    <rect x="20" y="82" width="260" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="32" y="108" font-size="16" fill="#0f172a">John</text>
    <rect x="236" y="68" width="44" height="22" rx="11" fill="#2563eb"/><text x="258" y="84" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">[12]</text>
    <rect x="20" y="144" width="120" height="40" rx="6" fill="#9333ea"/>
    <text x="80" y="170" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Submit</text>
    <rect x="130" y="130" width="44" height="22" rx="11" fill="#2563eb"/><text x="152" y="146" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">[35]</text>
    <circle cx="80" cy="164" r="18" fill="none" stroke="#9333ea" stroke-width="2" opacity="0.5"/>
    <circle cx="80" cy="164" r="28" fill="none" stroke="#9333ea" stroke-width="2" opacity="0.25"/>
    <text x="20" y="218" font-size="13" fill="#64748b">mask on: the user's clicks are blocked</text>
  </g>
</svg>
