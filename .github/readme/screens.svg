<svg xmlns="http://www.w3.org/2000/svg" width="1856" height="994" viewBox="0 0 1856 994" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1856" height="994" fill="#f5f7ff"/>

  <!-- panel 1: what the model sees -->
  <g transform="translate(40,40)">
    <rect width="900" height="440" rx="14" fill="#ffffff" stroke="#dde3f3"/>
    <text x="28" y="46" font-size="26" font-weight="700" fill="#0f172a">What the model sees: text, not pixels</text>
    <text x="28" y="76" font-size="18" fill="#64748b">the live DOM, flattened and numbered, sent with the task and the history</text>
    <rect x="28" y="98" width="844" height="258" rx="10" fill="#0f172a"/>
    <g font-size="18" fill="#e2e8f0">
      <text x="48" y="132" fill="#94a3b8">Current URL: https://example.com/signup</text>
      <text x="48" y="162" fill="#94a3b8">Interactive Elements:</text>
      <text x="48" y="196">[33]&lt;div&gt;User form&lt;/div&gt;</text>
      <text x="48" y="226">    [12]&lt;input placeholder='Username'/&gt;</text>
      <text x="48" y="256"><tspan fill="#c4b5fd">*</tspan>[35]&lt;button aria-label='Submit form'&gt;Submit&lt;/button&gt;</text>
      <text x="48" y="286">    [8]&lt;select&gt;Country&lt;/select&gt;</text>
      <text x="48" y="320" fill="#94a3b8">Step 2 of 40 max possible steps</text>
      <text x="48" y="344" fill="#94a3b8" font-size="15">600 pixels below the fold, not listed until you scroll</text>
    </g>
    <g font-size="16" fill="#0f172a">
      <text x="28" y="388">Only elements with a numeric [index] can be acted on.</text>
      <text x="28" y="414"><tspan fill="#7c3aed" font-weight="700">*</tspan> marks an element that appeared since the last step. Indentation means a child.</text>
    </g>
  </g>

  <!-- panel 2: one step -->
  <g transform="translate(980,40)">
    <rect width="836" height="440" rx="14" fill="#ffffff" stroke="#dde3f3"/>
    <text x="28" y="46" font-size="26" font-weight="700" fill="#0f172a">One step: reflect first, then one action</text>
    <text x="28" y="76" font-size="18" fill="#64748b">the shape the model must return every time, as a tool call</text>
    <rect x="28" y="98" width="780" height="258" rx="10" fill="#0f172a"/>
    <g font-size="17" fill="#e2e8f0">
      <text x="48" y="130">{</text>
      <text x="68" y="158"><tspan fill="#93c5fd">"evaluation_previous_goal"</tspan>: "Typed John into [12]. Verdict: Success",</text>
      <text x="68" y="186"><tspan fill="#93c5fd">"memory"</tspan>: "Username filled. Submit button is [35].",</text>
      <text x="68" y="214"><tspan fill="#93c5fd">"next_goal"</tspan>: "Click Submit to send the form.",</text>
      <text x="68" y="242"><tspan fill="#93c5fd">"action"</tspan>: { <tspan fill="#c4b5fd">"click_element_by_index"</tspan>: { "index": 35 } }</text>
      <text x="48" y="270">}</text>
      <text x="48" y="312" fill="#94a3b8" font-size="15">tool result: clicked element [35]. New elements marked * on the next step.</text>
      <text x="48" y="338" fill="#94a3b8" font-size="15">next: wait 0.4 s, read the page again, step 3 of 40</text>
    </g>
    <g font-size="15" fill="#0f172a">
      <text x="28" y="388" font-weight="700">Built-in tools:</text>
      <text x="150" y="388">done · wait · ask_user · click_element_by_index · input_text</text>
      <text x="28" y="412">select_dropdown_option · scroll · scroll_horizontally · execute_javascript (opt-in)</text>
    </g>
  </g>

  <!-- panel 3: add it to a page -->
  <g transform="translate(40,520)">
    <rect width="1776" height="434" rx="14" fill="#0f172a"/>
    <text x="28" y="50" font-size="26" font-weight="700" fill="#f8fafc">Add it to a page: one script tag to try, one import to ship</text>
    <text x="28" y="82" font-size="18" fill="#f8fafc" opacity="0.7">no backend, no extension, no screenshots. The model endpoint is yours.</text>
    <!-- left: code -->
    <text x="28" y="126" font-size="15" fill="#94a3b8">Try it, demo build with upstream's free testing model (evaluation only)</text>
    <rect x="28" y="138" width="1060" height="48" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="44" y="168" font-size="15" fill="#e2e8f0">&lt;script src="https://cdn.jsdelivr.net/npm/page-agent@1.10.0/dist/iife/page-agent.demo.js" crossorigin="true"&gt;&lt;/script&gt;</text>
    <text x="28" y="222" font-size="15" fill="#94a3b8">Ship it, with your own model</text>
    <rect x="28" y="234" width="1060" height="176" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <g font-size="17" fill="#e2e8f0">
      <text x="44" y="264"><tspan fill="#c4b5fd">import</tspan> { PageAgent } <tspan fill="#c4b5fd">from</tspan> 'page-agent'</text>
      <text x="44" y="294"><tspan fill="#c4b5fd">const</tspan> agent = <tspan fill="#c4b5fd">new</tspan> PageAgent({</text>
      <text x="76" y="322">model: 'qwen3.5-plus', baseURL: 'https://dashscope.aliyuncs.com/compatible-mode/v1',</text>
      <text x="76" y="350">apiKey: 'YOUR_API_KEY', language: 'en-US',</text>
      <text x="44" y="378">})</text>
      <text x="44" y="404"><tspan fill="#c4b5fd">await</tspan> agent.execute(<tspan fill="#86efac">'Click the login button'</tspan>)</text>
    </g>
    <!-- right: the panel -->
    <g transform="translate(1140,110)">
      <rect width="608" height="296" rx="14" fill="#1e293b" stroke="#334155"/>
      <rect x="0" y="0" width="608" height="48" rx="14" fill="#334155"/>
      <text x="24" y="31" font-size="18" font-weight="700" fill="#f8fafc">Page Agent</text>
      <circle cx="400" cy="24" r="7" fill="#22c55e"/><text x="416" y="30" font-size="15" fill="#f8fafc">running · step 3 of 40</text>
      <g font-size="15" fill="#e2e8f0">
        <text x="24" y="86" fill="#94a3b8">task</text><text x="90" y="86" font-weight="700">Click submit button, then fill username as John</text>
        <text x="24" y="124" fill="#93c5fd">1</text><text x="50" y="124">input_text</text><text x="200" y="124" fill="#94a3b8">index 12, "John"</text><text x="560" y="124" fill="#22c55e" text-anchor="end">0.3 s</text>
        <text x="24" y="156" fill="#93c5fd">2</text><text x="50" y="156">click_element_by_index</text><text x="300" y="156" fill="#94a3b8">index 35</text><text x="560" y="156" fill="#22c55e" text-anchor="end">0.2 s</text>
        <text x="24" y="188" fill="#93c5fd">3</text><text x="50" y="188">done</text><text x="200" y="188" fill="#94a3b8">"Form submitted for John."</text>
      </g>
      <rect x="24" y="216" width="560" height="44" rx="8" fill="#0f172a" stroke="#475569"/>
      <text x="40" y="244" font-size="15" fill="#94a3b8">Type the next task, or press stop</text>
      <text x="24" y="284" font-size="13" fill="#94a3b8">panel in English or Chinese · the mask blocks the user's clicks while a task runs</text>
    </g>
  </g>
</svg>
